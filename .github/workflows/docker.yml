name: Build and Push Docker Image

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: Optional image version tag
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run static checks
        run: |
          set -eu
          bash -n entrypoint.sh
          docker build --tag gh-proxy:test .
          docker run --rm -v "$PWD:/src" -w /src gh-proxy:test \
            python3 -m unittest discover -s tests -v

      - name: Test trusted proxy configuration
        run: |
          set -eu
          docker run --rm gh-proxy:test nginx -T 2>&1 \
            | grep -q 'map \$http_x_real_ip \$gh_proxy_client_ip'
          docker run --rm \
            -e GH_PROXY_TRUSTED_PROXIES='127.0.0.1,10.0.0.0/8,2001:db8::/32' \
            gh-proxy:test nginx -T 2>&1 | grep -q 'set_real_ip_from 10.0.0.0/8;'
          if docker run --rm -e GH_PROXY_TRUSTED_PROXIES='127.0.0.1,,10.0.0.0/8' gh-proxy:test true; then
            echo '空的可信代理配置项未被拒绝' >&2
            exit 1
          fi
          if docker run --rm -e GH_PROXY_TRUSTED_PROXIES='0.0.0.0/0' gh-proxy:test true; then
            echo '全网段可信代理配置未被拒绝' >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Prepare image tags
        id: tags
        env:
          IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          image="${IMAGE_NAMESPACE}/gh-proxy"
          {
            printf 'tags<<EOF\n'
            printf '%s:latest\n' "${image}"
            printf '%s:sha-%s\n' "${image}" "${SHA::12}"
            if [ -n "${VERSION}" ]; then
              printf '%s:%s\n' "${image}" "${VERSION}"
            fi
            printf 'EOF\n'
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
